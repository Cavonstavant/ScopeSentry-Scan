version: '3'
services:
  scan:
    # Built from the fork's main branch; pull_policy: build means it is never pulled.
    image: localhost/scopesentry-scan:local
    build:
      context: https://github.com/Cavonstavant/ScopeSentry-Scan.git#main
      dockerfile: dockerfile
    pull_policy: build
    # tools/linux/* in the image are amd64-only binaries.
    platform: linux/amd64
    network_mode: host
    container_name: scopesentry-scan
    restart: always
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      NodeName: ${NodeName}
      TimeZoneName: Asia/Shanghai
      MONGODB_IP: ${MONGODB_IP}
      MONGODB_PORT: ${MONGODB_PORT}
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      REDIS_IP: ${REDIS_IP}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
